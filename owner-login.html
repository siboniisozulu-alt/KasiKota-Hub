
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kota Connect | Owner Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #123d32;
      color: #17372e;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 35px #0003;
    }
    h1 { margin: 0 0 8px; }
    p { line-height: 1.5; color: #52645d; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #cbd5d0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
    a { color: #176b45; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Kota Connect</h1>
    <p>Shop Owner Login</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username"
             required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit" id="loginButton">Sign in</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./index.html">Back to KasiKota Hub</a></p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Replace these placeholders with your Firebase web app config.
    const firebaseConfig = {
      apiKey: "AIzaSyCxaY076gfNUfE3OzxkDJZ5xAdmLEuJzgs",
      authDomain: "kasikota-hub.firebaseapp.com",
      projectId: "kasikota-hub",
      appId: "kasikota-hub.firebaseapp.com"
    };

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById("loginForm").addEventListener(
        "submit", async (event) => {
          event.preventDefault();
          message.textContent = "";
          button.disabled = true;
          button.textContent = "Signing in…";

          try {
            await signInWithEmailAndPassword(
              auth,
              document.getElementById("email").value.trim(),
              document.getElementById("password").value
            );

            window.location.href = "./owners.html";
          } catch (error) {
            message.textContent =
              "Sign-in failed. Check your email and password.";
          } finally {
            button.disabled = false;
            button.textContent = "Sign in";
          }
        }
      );
    } catch (error) {
      message.textContent =
        "Login setup is incomplete. Check the Firebase configuration.";
    }
  </script>
</body>
</html>
