
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Secure Kota Connect shop administration.">
  <title>Kota Connect | Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff2d6;
      color: #222;
    }

    header {
      background: #171717;
      color: #fff;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 5px solid #ffb300;
    }

    header h1 {
      color: #ffbd35;
      margin: 5px 0;
    }

    main {
      max-width: 1000px;
      margin: 22px auto;
      padding: 12px;
    }

    .card {
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px #0001;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      border-radius: 8px;
      font: inherit;
    }

    input { border: 1px solid #bbb; }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #ffb300;
      color: #222;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #176b42;
      outline-offset: 2px;
    }

    .secondary { background: #eee; }
    .approve { background: #d4edda; }
    .reject { background: #f8d7da; }

    .application {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .application h3 { margin-top: 0; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 110px;
    }

    .muted { color: #666; }

    #message, #loginMessage {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: .9rem;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #e5c56b;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .actions { flex-direction: column; gap: 2px; }
      .actions button { width: 100%; }
    }
  </style>
</head>

<body>
<header>
  <h1>🍔 KOTA CONNECT</h1>
  <p>Administrator Dashboard</p>
</header>

<main>
  <section class="card" id="loginCard">
    <h2>Administrator Login</h2>
    <p>Sign in with your authorised administrator account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Firebase password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>
    </form>

    <p id="loginMessage" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="dashboard" hidden>
    <h2>Shop Applications</h2>
    <p id="signedInAs" class="muted"></p>

    <p class="warning">
      Approve only genuine applications. Applications with missing or
      invalid statuses are placed in Needs Checking and cannot be approved
      from that view.
    </p>

    <div class="actions">
      <button id="pendingButton" type="button">Pending</button>
      <button id="approvedButton" type="button" class="secondary">
        Approved
      </button>
      <button id="rejectedButton" type="button" class="secondary">
        Rejected
      </button>
      <button id="unknownButton" type="button" class="secondary">
        Needs Checking
      </button>
    </div>

    <button id="refreshButton" type="button" class="secondary">
      Refresh Applications
    </button>

    <p id="message" role="status" aria-live="polite"></p>
    <div id="applications"></div>

    <button id="logoutButton" type="button" class="secondary">
      Sign Out
    </button>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
(() => {
  "use strict";

  // Must match the administrator UID in Firebase Authentication
  // and the isAdmin() function in Firestore security rules.
  const ADMIN_UID = "4menEfIBN2XqMMi8dZPSrv73HlQ2";

  const firebaseConfig = {
    apiKey: "AIzaSyCxaY076gfNUfE3OzxkDJZ5xAdmLEuJzgs",
    authDomain: "kasikota-hub.firebaseapp.com",
    projectId: "kasikota-hub",
    storageBucket: "kasikota-hub.firebasestorage.app",
    messagingSenderId: "470531130099",
    appId: "1:470531130099:web:1bf117b7adf7a3a3d7ed86"
  };

  const loginCard = document.getElementById("loginCard");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const loginMessage = document.getElementById("loginMessage");
  const message = document.getElementById("message");
  const applications = document.getElementById("applications");

  let auth;
  let db;
  let currentFilter = "pending";
  let busy = false;
  let loading = false;
  let authReady = false;

  function setMessage(text) {
    message.textContent = text;
  }

  function setLoginMessage(text) {
    loginMessage.textContent = text;
  }

  function normaliseStatus(value) {
    if (typeof value !== "string") return "unknown";

    const status = value.trim().toLowerCase();

    if (["pending", "approved", "rejected"].includes(status)) {
      return status;
    }

    return "unknown";
  }

  function friendlyError(error) {
    console.error("Kota Connect Admin error:", error);

    const code = error && error.code;

    if (code === "permission-denied" ||
        code === "firestore/permission-denied") {
      return "Firebase denied access. Check the administrator UID and published Firestore security rules.";
    }

    if (code === "unauthenticated" ||
        code === "firestore/unauthenticated") {
      return "Your session has expired. Please sign in again.";
    }

    if (code === "unavailable" ||
        code === "firestore/unavailable") {
      return "Firebase is temporarily unavailable. Check your internet connection and retry.";
    }

    if (code === "auth/invalid-credential" ||
        code === "auth/wrong-password" ||
        code === "auth/user-not-found" ||
        code === "auth/invalid-login-credentials") {
      return "The email or password is incorrect.";
    }

    if (code === "auth/too-many-requests") {
      return "Too many sign-in attempts. Wait a while before trying again.";
    }

    if (error && error.message) {
      return "Operation failed: " + error.message;
    }

    return "The operation failed. Check your connection and try again.";
  }

  function updateButtons() {
    const disabled = busy || loading || !authReady;

    [
      "pendingButton",
      "approvedButton",
      "rejectedButton",
      "unknownButton",
      "refreshButton",
      "logoutButton"
    ].forEach(id => {
      document.getElementById(id).disabled = disabled;
    });

    applications.querySelectorAll("button").forEach(button => {
      button.disabled = busy || loading;
    });
  }

  function showFilterButtons() {
    const filters = {
      pendingButton: "pending",
      approvedButton: "approved",
      rejectedButton: "rejected",
      unknownButton: "unknown"
    };

    Object.entries(filters).forEach(([id, filter]) => {
      const button = document.getElementById(id);
      const selected = currentFilter === filter;

      button.classList.toggle("secondary", !selected);
      button.setAttribute("aria-pressed", String(selected));
    });
  }

  async function loadApplications() {
    if (loading || busy) return;

    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {
      applications.replaceChildren();
      setMessage("Administrator sign-in is required.");
      return;
    }

    loading = true;
    applications.replaceChildren();
    setMessage("Loading applications...");
    updateButtons();

    try {
      const snapshot = await db
        .collection("shopApplications")
        .get();

      const matching = snapshot.docs
        .map(doc => ({
          doc,
          data: doc.data(),
          status: normaliseStatus(doc.data().status)
        }))
        .filter(item => item.status === currentFilter)
        .sort((a, b) => {
          const aDate = a.data.createdAt;
          const bDate = b.data.createdAt;

          const aTime =
            aDate && typeof aDate.toMillis === "function"
              ? aDate.toMillis() : 0;

          const bTime =
            bDate && typeof bDate.toMillis === "function"
              ? bDate.toMillis() : 0;

          return bTime - aTime;
        });

      if (matching.length === 0) {
        const detail = currentFilter === "unknown"
          ? "No applications with missing or invalid statuses were found."
          : "No " + currentFilter + " applications found.";

        setMessage(
          detail + " Total documents in shopApplications: " +
          snapshot.size + "."
        );
        return;
      }

      matching.forEach(item => {
        const doc = item.doc;
        const data = item.data;
        const statusValue = item.status;

        const card = document.createElement("article");
        card.className = "application";

        const title = document.createElement("h3");
        title.textContent = data.shopName || "Unnamed shop";
        card.appendChild(title);

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = "Status: " + statusValue;
        card.appendChild(status);

        [
          ["Owner", data.ownerName],
          ["Email", data.email],
          ["Phone", data.phone],
          ["Address", data.address],
          ["Description", data.description]
        ].forEach(([label, value]) => {
          const p = document.createElement("p");
          p.textContent = label + ": " + (value || "Not provided");
          card.appendChild(p);
        });

        const idLine = document.createElement("p");
        idLine.className = "muted";
        idLine.textContent = "Application document ID: " + doc.id;
        card.appendChild(idLine);

        if (statusValue === "pending") {
          const actions = document.createElement("div");
          actions.className = "actions";

          const approve = document.createElement("button");
          approve.type = "button";
          approve.className = "approve";
          approve.textContent = "Approve & Publish";

          const reject = document.createElement("button");
          reject.type = "button";
          reject.className = "reject";
          reject.textContent = "Reject";

          approve.addEventListener("click", () => {
            reviewApplication(doc.id, "approved");
          });

          reject.addEventListener("click", () => {
            reviewApplication(doc.id, "rejected");
          });

          actions.append(approve, reject);
          card.appendChild(actions);
        } else if (statusValue === "unknown") {
          const warning = document.createElement("p");
          warning.className = "warning";
          warning.textContent =
            "This record has no valid status. Check it in Firestore before taking action.";
          card.appendChild(warning);
        }

        applications.appendChild(card);
      });

      setMessage(
        matching.length + " " + currentFilter +
        " application(s) shown."
      );

    } catch (error) {
      setMessage(friendlyError(error));
    } finally {
      loading = false;
      updateButtons();
    }
  }

  async function reviewApplication(id, newStatus) {
    if (busy || loading) return;

    if (!["approved", "rejected"].includes(newStatus)) {
      setMessage("Invalid review action.");
      return;
    }

    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {
      setMessage("Administrator access required.");
      return;
    }

    const prompt = newStatus === "approved"
      ? "Approve this application and publish its shop record?"
      : "Reject this shop application?";

    if (!window.confirm(prompt)) return;

    busy = true;
    setMessage("Processing application...");
    updateButtons();

    try {
      // Refresh the sign-in token before the privileged operation.
      await user.getIdToken(true);

      if (!auth.currentUser ||
          auth.currentUser.uid !== ADMIN_UID) {
        throw new Error("Administrator identity changed.");
      }

      const applicationRef = db
        .collection("shopApplications")
        .doc(id);

      // This design assumes registration creates each application
      // using the owner's Firebase UID as the document ID.
      const shopRef = db.collection("shops").doc(id);

      await db.runTransaction(async transaction => {
        const applicationSnapshot =
          await transaction.get(applicationRef);

        if (!applicationSnapshot.exists) {
          throw new Error("Application no longer exists.");
        }

        const data = applicationSnapshot.data();

        // Do not treat a missing or invalid status as pending.
        if (normaliseStatus(data.status) !== "pending") {
          throw new Error(
            "This application is no longer pending. Refresh the dashboard."
          );
        }

        if (newStatus === "approved") {
          if (!id || !data.shopName || !data.email) {
            throw new Error(
              "The application is missing its ID, shop name, or email. Check the record before approving."
            );
          }

          // Never silently overwrite an existing public shop record.
          const existingShop = await transaction.get(shopRef);

          if (existingShop.exists) {
            throw new Error(
              "A shop record already exists with this document ID. Check the existing shop and owner UID in Firestore before proceeding."
            );
          }

          // The application document ID must be the owner's Firebase UID.
          const ownerUid = applicationSnapshot.id;

          const shopRecord = {
            ownerUid: ownerUid,
            ownerName: data.ownerName || "",
            shopName: data.shopName,
            name: data.shopName,
            email: data.email,
            phone: data.phone || "",
            address: data.address || "",
            description: data.description || "",
            status: "approved",
            createdAt: data.createdAt || null,
            reviewedAt:
              firebase.firestore.FieldValue.serverTimestamp()
          };

          transaction.set(shopRef, shopRecord);
        }

        transaction.update(applicationRef, {
          status: newStatus,
          reviewedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      setMessage(
        newStatus === "approved"
          ? "Application approved and shop record published. Check the public website to confirm the shop appears correctly."
          : "Application rejected."
      );

      // Show the applications in the current tab after the transaction.
      currentFilter = newStatus;
      showFilterButtons();

    } catch (error) {
      setMessage(friendlyError(error));
    } finally {
      busy = false;
      updateButtons();
    }

    // Refresh after the operation has finished.
    if (auth.currentUser && auth.currentUser.uid === ADMIN_UID) {
      await loadApplications();
    }
  }

  async function signIn(event) {
    event.preventDefault();

    if (!authReady) {
      setLoginMessage("Firebase is still starting. Please retry.");
      return;
    }

    loginButton.disabled = true;
    setLoginMessage("");

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      await auth.signInWithEmailAndPassword(email, password);
    } catch (error) {
      setLoginMessage(friendlyError(error));
    } finally {
      loginButton.disabled = false;
    }
  }

  function selectFilter(filter) {
    if (busy || loading) return;

    currentFilter = filter;
    showFilterButtons();
    loadApplications();
  }

  loginForm.addEventListener("submit", signIn);

  document.getElementById("pendingButton")
    .addEventListener("click", () => selectFilter("pending"));

  document.getElementById("approvedButton")
    .addEventListener("click", () => selectFilter("approved"));

  document.getElementById("rejectedButton")
    .addEventListener("click", () => selectFilter("rejected"));

  document.getElementById("unknownButton")
    .addEventListener("click", () => selectFilter("unknown"));

  document.getElementById("refreshButton")
    .addEventListener("click", loadApplications);

  document.getElementById("logoutButton")
    .addEventListener("click", async () => {
      if (busy || loading) return;

      try {
        await auth.signOut();
        setMessage("");
      } catch (error) {
        setMessage("Sign-out failed. Please retry.");
        console.error(error);
      }
    });

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    auth = firebase.auth();
    db = firebase.firestore();

    auth.onAuthStateChanged(async user => {
      authReady = true;
      applications.replaceChildren();
      setLoginMessage("");

      if (!user) {
        loginCard.hidden = false;
        dashboard.hidden = true;
        updateButtons();
        return;
      }

      if (user.uid !== ADMIN_UID) {
        dashboard.hidden = true;
        loginCard.hidden = false;

        setLoginMessage(
          "This account is not authorised for the admin dashboard."
        );

        try {
          await auth.signOut();
        } catch (error) {
          console.error("Sign-out error:", error);
        }

        updateButtons();
        return;
      }

      loginCard.hidden = true;
      dashboard.hidden = false;

      document.getElementById("signedInAs").textContent =
        "Signed in as: " + (user.email || "Administrator");

      showFilterButtons();
      updateButtons();
      await loadApplications();
    });

  } catch (error) {
    console.error("Firebase initialization error:", error);

    loginCard.hidden = false;
    dashboard.hidden = true;

    setLoginMessage(
      "Firebase could not start. Check the project configuration and reload."
    );
  }
})();
</script>
</body>
</html>
