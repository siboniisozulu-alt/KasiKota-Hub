

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kota Connect | Shop Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff2d6, #ffe0a3);
      color: #222;
    }

    header {
      background: #171717;
      color: white;
      text-align: center;
      padding: 28px 15px;
      border-bottom: 5px solid #ffb300;
    }

    header h1 {
      margin: 0;
      color: #ffbd35;
      font-size: 32px;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000015;
    }

    h2 {
      color: #b66b00;
      text-align: center;
    }

    .register-button {
      display: block;
      background: #ffb300;
      color: #171717;
      text-align: center;
      padding: 16px;
      margin: 20px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .form-frame {
      width: 100%;
      height: 1100px;
      border: none;
      border-radius: 12px;
      background: #fff;
    }

    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 18px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍔 KOTA CONNECT</h1>
    <p>Connecting customers with local Kota businesses</p>
  </header>

  <main>
    <section class="card">
      <h2>Register Your Kota Shop</h2>

      <p>
        Join Kota Connect and help more customers
        discover your business online.
      </p>

      <a
        class="register-button"
        href="https://docs.google.com/forms/d/e/1FAIpQLSd3OmBSe5-xa65bFvzhPTO-L9Y6mLKGg_4keNTve-m-L-wweA/viewform"
        target="_blank"
        rel="noopener noreferrer">
        📝 OPEN SHOP REGISTRATION FORM
      </a>

      <div class="form-frame">
        <iframe
          title="Kota Connect shop registration"
          src="https://docs.google.com/forms/d/e/1FAIpQLSd3OmBSe5-xa65bFvzhPTO-L9Y6mLKGg_4keNTve-m-L-wweA/viewform?embedded=true"
          width="100%"
          height="1100"
          frameborder="0"
          marginheight="0"
          marginwidth="0">
          Loading registration form...
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>© Kota Connect | Supporting Local Businesses 🇿🇦</p>
  </footer>

</body>
</html>

</body>
</html>
